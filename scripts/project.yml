# 公開樹的 Mac 輸入法專案。
# 用 XcodeGen 2.45.4 產生 ZhuyinTai.xcodeproj（見 scripts/generate_xcodeproj.sh）。版本寫死，腳本不會安裝工具。
# 專案檔名用 ZhuyinTai，避免和 twkeyboard.xcodeproj 在不分大小寫的磁碟上撞名。
# 目標：TWKeyboard（輸入法 app）與 Megrez。
# 本檔放在 scripts/，但下面所有路徑都相對於樹根目錄（腳本用 --project-root 指到根目錄）。
# 引擎在 ZhuyinTai/OpenCore/BasicEngine/。Tests/ 不編進 app。
name: ZhuyinTai
options:
  bundleIdPrefix: com.kota.xrich
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: zh-Hant
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SDKROOT: macosx
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: "-"
packages:
  UpdateCheck:
    path: Packages/UpdateCheck
targets:
  Megrez:
    type: framework
    platform: macOS
    sources:
      - path: Shared/Megrez
        excludes:
          - LICENSE
          - CUSTOM_LGPLv3_EXCEPTION.md
      - path: Shared/Megrez/LICENSE
        buildPhase: resources
      - path: Shared/Megrez/CUSTOM_LGPLv3_EXCEPTION.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kota.xrich.TWKeyboard.Megrez
        PRODUCT_NAME: Megrez
        PRODUCT_MODULE_NAME: Megrez
        DEFINES_MODULE: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @loader_path/Frameworks"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-cmo"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        MACH_O_TYPE: mh_dylib
  TWKeyboard:
    type: application
    platform: macOS
    sources:
      - path: ZhuyinTai
        excludes:
          - ClosedCore/**
          - OpenCore/BasicEngine/Tests/**
          - Resources/DomainPacks.bundle/**
          - Resources/initial_reading_mask.bin
          - Info.plist
          - ZhuyinTai.entitlements
          - "**/.DS_Store"
      - path: Shared/BopomofoSegmenter
      - path: Shared/CompositionCursorScrubSupport.swift
      - path: Shared/UserCustomPhrasesStore.swift
      - path: Shared/LegalKeySyllableComposer.swift
      - path: Shared/LegalKeyBackspacePlan.swift
      - path: Shared/LegalKeyGateRevision.swift
      - path: Shared/LexiconLookup.swift
      - path: Shared/MacPrefsSchema.swift
      - path: Shared/MacReadingSlot.swift
      - path: Shared/MacUsageLogCleaner.swift
      - path: Shared/MacReadingPanelPreference.swift
      - path: TWKCoreAPI
        optional: true
      # 小麥注音上游 7 檔（MIT，commit 73d0379）。只當 bundle resource，不加編譯、不加標頭。
      - path: Vendor/McBopomofo/LICENSE.txt
        buildPhase: resources
      - path: Vendor/McBopomofo/Source/Data/BPMFBase.txt
        buildPhase: resources
      - path: Vendor/McBopomofo/Source/Data/BPMFMappings.txt
        buildPhase: resources
      - path: Vendor/McBopomofo/Source/Data/phrase.occ
        buildPhase: resources
      - path: Vendor/McBopomofo/Source/Data/heterophony1.list
        buildPhase: resources
      - path: Vendor/McBopomofo/Source/Data/heterophony2.list
        buildPhase: resources
      - path: Vendor/McBopomofo/Source/Data/heterophony3.list
        buildPhase: resources
    dependencies:
      - target: Megrez
        embed: true
        codeSign: false
      - package: UpdateCheck
        product: UpdateCheck
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    settings:
      base:
        PRODUCT_NAME: TWKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: com.kota.xrich.inputmethod.TWKeyboardOSS
        INFOPLIST_KEY_CFBundleDisplayName: "注音台（自編版）"
        INFOPLIST_KEY_CFBundleName: "注音台（自編版）"
        INFOPLIST_FILE: ZhuyinTai/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZhuyinTai/ZhuyinTai.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG MEGREZ_DYNAMIC
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: MEGREZ_DYNAMIC
schemes:
  TWKeyboard:
    build:
      targets:
        TWKeyboard: all
        Megrez: all
    run:
      config: Debug
